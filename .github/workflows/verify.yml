name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - automation/**
      - codex/**
  workflow_dispatch:
  schedule:
    - cron: "23 15 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.lock.outputs.release_tag }}
      patch_revision: ${{ steps.lock.outputs.patch_revision }}
      artifact: ${{ steps.lock.outputs.artifact }}
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: Check out overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      - name: Read lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          echo "go_version=$(jq -r .go_version openbao.lock.json)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$(jq -r .release_tag openbao.lock.json)" >> "$GITHUB_OUTPUT"
          echo "patch_revision=$(jq -r .patch_revision openbao.lock.json)" >> "$GITHUB_OUTPUT"
          artifact="$(jq -r .artifact_name openbao.lock.json)"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "artifact_path=dist/$artifact" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: go

      - name: Install vulnerability scanner
        shell: bash
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Verify and build
        shell: pwsh
        run: ./scripts/Verify-Build.ps1 -RequireVulnerabilityCheck

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.lock.outputs.artifact_path }}
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openbao-public-client-${{ github.sha }}
          path: |
            dist/${{ steps.lock.outputs.artifact }}
            dist/${{ steps.lock.outputs.artifact }}.sha256
            dist/source-manifest.json
            dist/sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.lock.outputs.artifact_path }}

  release:
    name: release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openbao-public-client-${{ github.sha }}
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: openbao-${{ needs.verify.outputs.release_tag }}-public-client-r${{ needs.verify.outputs.patch_revision }}
          UPSTREAM_TAG: ${{ needs.verify.outputs.release_tag }}
          PATCH_REVISION: ${{ needs.verify.outputs.patch_revision }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --prerelease \
              --title "OpenBao $UPSTREAM_TAG public-client plugin r$PATCH_REVISION" \
              --notes "Externally registered JWT auth plugin built from the pinned official OpenBao release and the tracked public-client patch."
          fi
